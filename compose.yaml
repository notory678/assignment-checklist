services:
  app:
    build: .
    environment:
      PGHOST: db
      PGDATABASE: checklist
      PGUSER: checklist
      PGPASSWORD: ${POSTGRES_PASSWORD:-checklist_dev}
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL-qwen3:4b}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 15

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: checklist
      POSTGRES_USER: checklist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-checklist_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "checklist", "-d", "checklist"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
